    <!-- Set the chrome theme class before first paint to avoid a light flash.
         Mirrors applyEditorTheme in @bingo/ui (default: system). -->
    <script>
      try {
        var theme = localStorage.getItem('bingo-editor-theme');
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('editor-dark');
        }
      } catch (e) { }
