<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bingo recovered components</title>
    <script>
      // Same first-paint theme bootstrap the real renderer uses.
      try {
        var t = localStorage.getItem("bingo-editor-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("editor-dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
